name: Secret Scan

# Forge P1 security hardening — surface-audit finding: the repo's .env/.p8/
# service-account files are correctly gitignored, but nothing automatically
# guards against a FUTURE accidental commit of a real credential (API key,
# private key, webhook secret, etc.) pasted into source, a script, or a
# fixture. This job is additive — it never touches the existing `ci.yml`
# jobs or gates them; it runs standalone on the same push/PR triggers.
#
# `.gitleaks.toml` (repo root) extends gitleaks' default ruleset with a
# narrow allowlist for the handful of known-safe placeholder strings already
# in this repo (verified 2026-07-12 via `gitleaks detect --log-opts="--all"`
# — zero real findings across full git history with that config).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history — gitleaks scans commits, not just the working tree)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Free for open-source repos (gitleaks.io); required for gitleaks-
          # action's PR-comment/summary feature on PRIVATE repos. If this repo
          # is private and the job fails with a license error, generate a key
          # at https://gitleaks.io and add it as the GITLEAKS_LICENSE repo
          # secret — the core scan step below still enforces the gate either
          # way (a leaked secret fails the job regardless of the license).
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
