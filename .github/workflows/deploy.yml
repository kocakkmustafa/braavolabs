name: Build & Deploy

on:
  push:
    tags: ["v*"]
    # Workflow-only maintenance must not rebuild images or touch production.
    # GitHub does not evaluate path filters for tag pushes, so release tags
    # remain deploy-capable; workflow_dispatch below is also unchanged.
    paths-ignore:
      - ".github/workflows/**"
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        default: production
        type: choice
        options:
          - production
          - staging

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  # Required proof uploads remain bounded; this optional Docker Desktop record is not.
  DOCKER_BUILD_RECORD_UPLOAD: "false"
  REGISTRY: ghcr.io
  IMAGE_PREFIX_RAW: ${{ github.repository }}

jobs:
  require-green-ci:
    name: Require exact main CI before image push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # main, tag and manual releases all require CI push/main evidence for
      # this exact SHA. PR green is not deployment permission. The checker
      # polls for at most 25 minutes, outside the CI run to avoid deadlock.
      - name: Verify latest exact-SHA CI and useful jobs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/require-green-ci.mjs

  build-images:
    name: Build & push (api + ui)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: require-green-ci
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [api, ui]
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag and lowercased prefix
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          prefix_lower="$(printf '%s' "$IMAGE_PREFIX_RAW" | tr '[:upper:]' '[:lower:]')"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            tag="sha-${GITHUB_SHA::8}"
          fi
          printf 'prefix=%s\ntag=%s\n' "$prefix_lower" "$tag" >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push api image
        if: matrix.service == 'api'
        id: build-api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ENV/Dockerfile.api
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.tag.outputs.prefix }}/api:${{ steps.tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ steps.tag.outputs.prefix }}/api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push ui image
        if: matrix.service == 'ui'
        id: build-ui
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ENV/Dockerfile.ui
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.tag.outputs.prefix }}/ui:${{ steps.tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ steps.tag.outputs.prefix }}/ui:latest
          cache-from: type=gha,scope=ui
          cache-to: type=gha,mode=max,scope=ui
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.braavolabs.com/api/v1
            NEXT_PUBLIC_APP_URL=https://braavolabs.com
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.UI_SENTRY_DSN }}
            NEXT_PUBLIC_SENTRY_RELEASE=${{ github.sha }}
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Record immutable service digest
        shell: bash
        env:
          API_DIGEST: ${{ steps.build-api.outputs.digest }}
          UI_DIGEST: ${{ steps.build-ui.outputs.digest }}
        run: |
          set -euo pipefail
          digest="${API_DIGEST:-${UI_DIGEST:-}}"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf '%s\n' "$digest" > "$RUNNER_TEMP/${{ matrix.service }}.digest"
          test "$(wc -c < "$RUNNER_TEMP/${{ matrix.service }}.digest")" -eq 72

      - name: Upload immutable service digest
        uses: actions/upload-artifact@v4
        with:
          name: image-digest-${{ matrix.service }}
          path: ${{ runner.temp }}/${{ matrix.service }}.digest
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy to ${{ github.event.inputs.environment || 'production' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build-images
    environment: ${{ github.event.inputs.environment || 'production' }}
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          # deploy-platform.sh verifies and diffs the previous-good commit.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Image builds take time. Refuse an older green result if the same CI
      # commit was re-run/failed in the meantime, before preparing SSH secrets.
      - name: Reverify latest exact-SHA CI before deployment
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/require-green-ci.mjs

      - name: Download immutable image digests
        uses: actions/download-artifact@v4
        with:
          pattern: image-digest-*
          path: ${{ runner.temp }}/image-digests
          merge-multiple: false

      - name: Execute fail-closed release orchestration
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          DEPLOY_PORT: "22"
          DEPLOY_USER: ${{ secrets.LIGHTSAIL_USER }}
          LIGHTSAIL_SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          LIGHTSAIL_KNOWN_HOSTS: ${{ secrets.LIGHTSAIL_KNOWN_HOSTS }}
          SSH_HOST_KEY_SHA256: ${{ secrets.LIGHTSAIL_HOST_KEY_SHA256 }}
          PREVIOUS_RELEASE_COMMIT: ${{ vars.BRAAVOLABS_PREVIOUS_GOOD_COMMIT }}
          RELEASE_COMMIT: ${{ github.sha }}
          REMOTE_APP_ROOT: /opt/braavolabs
          IMAGE_PREFIX: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail
          umask 077
          identity_file="$RUNNER_TEMP/lightsail-identity"
          known_hosts_file="$RUNNER_TEMP/lightsail-known-hosts"
          cleanup() {
            primary=$?
            set +e
            rm -f -- "$identity_file" "$known_hosts_file"
            cleanup_status=$?
            set -e
            if test "$primary" -ne 0; then exit "$primary"; fi
            if test "$cleanup_status" -ne 0; then exit 66; fi
            exit 0
          }
          signal_cleanup() { trap - HUP INT TERM; exit 66; }
          trap cleanup EXIT
          trap signal_cleanup HUP INT TERM
          printf '%s\n' "$LIGHTSAIL_SSH_KEY" > "$identity_file"
          printf '%s\n' "$LIGHTSAIL_KNOWN_HOSTS" > "$known_hosts_file"
          chmod 0600 "$identity_file" "$known_hosts_file"
          api_digest="$(cat "$RUNNER_TEMP/image-digests/image-digest-api/api.digest")"
          ui_digest="$(cat "$RUNNER_TEMP/image-digests/image-digest-ui/ui.digest")"
          test "${api_digest#sha256:}" != "$api_digest"
          test "${ui_digest#sha256:}" != "$ui_digest"
          export SSH_IDENTITY_FILE="$identity_file"
          export SSH_KNOWN_HOSTS_FILE="$known_hosts_file"
          export API_IMAGE_REF="${IMAGE_PREFIX,,}/api@${api_digest}"
          export UI_IMAGE_REF="${IMAGE_PREFIX,,}/ui@${ui_digest}"
          ./scripts/deploy-platform.sh
