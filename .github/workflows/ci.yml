name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Required proof uploads remain bounded; this optional Docker Desktop record is not.
  DOCKER_BUILD_RECORD_UPLOAD: "false"
  NODE_VERSION: "20"

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # pnpm version is read from packageManager in package.json — do NOT
      # also pass `version` here (raises ERR_PNPM_BAD_PM_VERSION).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @ai-company-os/db exec prisma generate

      - name: Build core package
        run: pnpm --filter @ai-company-os/core build

      - name: Build memory package
        run: pnpm --filter @ai-company-os/memory build

      - name: Build integrations package
        run: pnpm --filter @ai-company-os/integrations build

      # The API imports @ai-company-os/connector-sdk, which resolves via its
      # built dist/ (main/types point at dist, and dist is gitignored). Build it
      # before type-checking the API or tsc raises TS2307 (module not found).
      - name: Build connector-sdk package
        run: pnpm --filter @ai-company-os/connector-sdk build

      - name: Type check API
        run: pnpm --filter @ai-company-os/api exec tsc --noEmit

      - name: Lint
        run: pnpm lint

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma Client
        run: pnpm --filter @ai-company-os/db exec prisma generate
      - name: Build deps for test
        run: |
          pnpm --filter @ai-company-os/core build
          pnpm --filter @ai-company-os/memory build
          pnpm --filter @ai-company-os/integrations build
          pnpm --filter @ai-company-os/connector-sdk build
      # Seed the env vars that env.ts validates at module-load time.
      # Vitest imports the API source which transitively loads env.ts;
      # without these the parse step throws at import and entire test
      # files fail before a single `it()` block runs. Values are
      # placeholders — none of these tests touch the network or DB; the
      # parser just needs the right shape so process.env passes Zod.
      # If a test in the future ACTUALLY needs a working DB / Redis,
      # spin up a service container above this step (postgres + redis)
      # rather than swapping these constants for live URLs.
      - name: Run tests (only packages that define a test script)
        env:
          DATABASE_URL: "postgresql://test:test@localhost:5432/test?schema=public"
          REDIS_URL: "redis://localhost:6379"
          JWT_SECRET: "ci-test-jwt-secret-must-be-at-least-32-characters-long-xx"
          ENCRYPTION_KEY: "ci-test-encryption-key-32-chars-minimum-aabbccddeeff00"
          NODE_ENV: "test"
        run: pnpm -r --if-present test
      - name: Public rendering regressions (SSR and HTTP contract)
        run: node --test scripts/auth-entry-contract.test.mjs scripts/bench-request-boundary.test.mjs

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Build workspaces
        run: pnpm build

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -f ENV/Dockerfile.api -t ai-company-os-api:${{ github.sha }} .
          docker build -f ENV/Dockerfile.ui -t ai-company-os-ui:${{ github.sha }} .

      - name: Test Docker image starts
        run: |
          docker run --rm -d --name test-api \
            -e DATABASE_URL="postgresql://test:test@localhost:5432/test" \
            -e JWT_SECRET="test-secret-ci" \
            -e REDIS_URL="redis://localhost:6379" \
            ai-company-os-api:${{ github.sha }} || true
          sleep 2
          docker stop test-api || true

  boot-smoke:
    name: Boot Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    # Runs on PRs too (unlike "Docker Build", which is gated to main). That
    # is the whole point: I-001 (2026-07-14) shipped a pnpm-override that
    # crashed the api container at BOOT — an import-time failure vitest can
    # never see because it does not load the OpenTelemetry instrumentation
    # entry (packages/api/src/lib/otel-imports → telemetry.ts, imported at
    # the very top of index.ts before app.listen). CI was green; prod 502'd
    # for ~8 minutes. This job builds the real api image and starts the real
    # `node dist/index.js` entrypoint, so any import-time crash turns the PR
    # red instead of reaching prod.
    #
    # /api/v1/health does `SELECT 1` + `redis.ping()` and only returns
    # status:"ok" (HTTP 200) when BOTH are reachable — so we run real
    # postgres + redis service containers (env values based on the `test`
    # job above). No migrations are needed: the health probe is
    # schema-independent, and boot-time seeds (seedBenchSuites etc.) are
    # catch-wrapped, so the server binds and serves 200 without them.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build ONLY the api image, loaded into the local docker daemon.
      # Shares the GitHub Actions layer cache with deploy.yml's api build
      # (scope=api) so re-builds are ~90s once warm.
      - name: Build api image (cached)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ENV/Dockerfile.api
          load: true
          tags: aicos-api:boot-smoke
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Boot api container + wait for /api/v1/health (from inside)
        run: |
          set -uo pipefail

          # --network host so the container reaches the postgres/redis
          # service containers (published on the runner's localhost) and so
          # the in-container probe at 127.0.0.1:8080 hits the API listener.
          # NODE_ENV=production reproduces the exact prod boot path (the
          # production-only env.ts safety checks, prod CORS branch, etc.).
          # Secrets/URLs are dummy but valid-shaped: APP_URL must be https,
          # JWT_SECRET/ENCRYPTION_KEY are the >=32-char CI test values (they
          # contain no placeholder tokens, so env.ts prod checks pass).
          docker run -d --name boot-smoke-api --network host \
            -e NODE_ENV=production \
            -e API_HOST=0.0.0.0 \
            -e API_PORT=8080 \
            -e APP_URL=https://braavolabs.com \
            -e DATABASE_URL="postgresql://test:test@localhost:5432/test?schema=public" \
            -e REDIS_URL="redis://localhost:6379" \
            -e JWT_SECRET="ci-test-jwt-secret-must-be-at-least-32-characters-long-xx" \
            -e ENCRYPTION_KEY="ci-test-encryption-key-32-chars-minimum-aabbccddeeff00" \
            aicos-api:boot-smoke

          echo "=== Waiting up to 60s for /api/v1/health → 200 from INSIDE the container ==="
          ok=0
          for i in $(seq 1 30); do
            # Probe with the image's own busybox wget from inside the
            # container — proves the container itself serves, not the host.
            if docker exec boot-smoke-api wget -q -O- http://127.0.0.1:8080/api/v1/health 2>/dev/null | grep -q '"status":"ok"'; then
              echo "✅ /api/v1/health → ok (attempt $i)"
              ok=1
              break
            fi
            # Fail fast if the container already died — that IS the I-001
            # import-time crash signature.
            if [ "$(docker inspect -f '{{.State.Running}}' boot-smoke-api 2>/dev/null)" != "true" ]; then
              echo "❌ Container exited before becoming healthy (import-time boot crash)"
              break
            fi
            echo "  attempt $i — not ready, waiting 2s..."
            sleep 2
          done

          if [ "$ok" != "1" ]; then
            echo "❌ BOOT SMOKE FAILED — container logs:"
            echo "────────────────────────────────────────────────────────────"
            docker logs boot-smoke-api 2>&1 || true
            echo "────────────────────────────────────────────────────────────"
            docker rm -f boot-smoke-api >/dev/null 2>&1 || true
            exit 1
          fi

          echo "Boot smoke passed — container booted and served /api/v1/health."
          docker rm -f boot-smoke-api >/dev/null 2>&1 || true

  db-migration-check:
    name: DB Migration Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint-and-typecheck
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aicos
          POSTGRES_PASSWORD: aicos_ci
          POSTGRES_DB: aicos_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run migrations
        env:
          DATABASE_URL: postgresql://aicos:aicos_ci@localhost:5432/aicos_ci?schema=public
        run: pnpm --filter @ai-company-os/db exec prisma migrate deploy

      - name: Validate schema
        env:
          DATABASE_URL: postgresql://aicos:aicos_ci@localhost:5432/aicos_ci?schema=public
        run: pnpm --filter @ai-company-os/db exec prisma validate

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: lint-and-typecheck
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: aicos_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      E2E_DATABASE_URL: postgresql://test:test@localhost:5432/aicos_e2e
      DATABASE_URL: postgresql://test:test@localhost:5432/aicos_e2e
      REDIS_URL: redis://localhost:6379
      # Build + serve one explicit self-hosted operator surface. The real
      # middleware rejects 127.0.0.1 in non-development mode, so browser tests
      # use the resolved operator authority and request tests send explicit
      # product hosts instead of weakening the production host boundary for CI.
      SELF_HOSTED_SURFACE_HOSTS: operator.example
      NEXT_PUBLIC_API_URL: https://api.operator.example/api/v1
      # The standalone bundle is correct on a runner (no relocated pnpm store —
      # see e2e/README.md for why it is bypassed locally).
      E2E_UI_STANDALONE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Prisma db push cannot create a table with vector(1536) until the
      # extension exists. The pgvector image ships the extension but does not
      # enable it in every newly-created database automatically.
      - name: Enable pgvector extension
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS vector;'
      - run: pnpm --filter @ai-company-os/db exec prisma db push --skip-generate --accept-data-loss
      - name: Generate Prisma Client
        run: pnpm --filter @ai-company-os/db exec prisma generate
      # The real-router isolation suite imports workspace packages through
      # their package.json dist/ entrypoints. A clean runner has no dist/
      # artifacts after install, so build the same dependency set as the
      # unit-test job before loading the routers.
      - name: Build deps for cross-tenant matrix
        run: |
          pnpm --filter @ai-company-os/core build
          pnpm --filter @ai-company-os/memory build
          pnpm --filter @ai-company-os/integrations build
          pnpm --filter @ai-company-os/connector-sdk build
      # BR-P0-004 slice 4. The cross-tenant matrix skips itself unless
      # XTENANT_DATABASE_URL is set — deliberate, so a laptop `pnpm test` does
      # not need a database. But that meant all 15 of its tests were SKIPPED in
      # every CI run too, so the suite contributed ZERO assurance where it
      # matters most. It runs here, against the same throwaway Postgres.
      - name: Cross-tenant isolation matrix
        run: pnpm --filter @ai-company-os/api test:xtenant
        env:
          XTENANT_DATABASE_URL: postgresql://test:test@localhost:5432/aicos_e2e
          REQUIRE_XTENANT_MATRIX: "1"
      - run: pnpm build
      - name: Link standalone assets
        # Next does not copy .next/static or public/ into the standalone bundle;
        # without this the server starts and every asset 404s.
        run: |
          SA=packages/ui/.next/standalone/packages/ui
          mkdir -p "$SA/.next"
          cp -R packages/ui/.next/static "$SA/.next/static"
          if [ -d packages/ui/public ]; then cp -R packages/ui/public "$SA/public"; fi
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run E2E
        run: pnpm exec playwright test
      # Retain every proof file; reject oversize evidence before any upload.
      - name: Bound Playwright evidence
        id: playwright-evidence
        if: always()
        run: python3 scripts/pack-bounded-evidence.py --kind playwright --output "$RUNNER_TEMP/bounded-playwright/evidence.tar"
      - uses: actions/upload-artifact@v4
        # Anonymous auth screenshots + source/build identities are attached on
        # success too. Existing trace/video capture remains failure-only.
        if: always() && steps.playwright-evidence.outcome == 'success'
        with:
          name: playwright-report
          path: ${{ runner.temp }}/bounded-playwright/evidence.tar
          compression-level: 0
          if-no-files-found: error
          retention-days: 3

  release-artifacts:
    name: SBOM + checksums
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Generates a CycloneDX SBOM and SHA256SUMS, then VERIFIES the checksums
      # it just wrote — generating them proves nothing on its own.
      - name: Generate and verify release artifacts
        run: bash scripts/release-artifacts.sh
      - name: Bound release provenance
        run: python3 scripts/pack-bounded-evidence.py --kind provenance --output "$RUNNER_TEMP/bounded-provenance/evidence.tar"
      - uses: actions/upload-artifact@v4
        with:
          name: release-provenance
          path: ${{ runner.temp }}/bounded-provenance/evidence.tar
          compression-level: 0
          if-no-files-found: error
          retention-days: 3

  release-contracts:
    name: Release contracts + brand motion
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Release regressions compare two fixed historical migration commits.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # These hermetic root suites are not found by pnpm's workspace test task.
      # No install, service, network credential or optional/continue-on-error path.
      - name: Release contract regressions
        run: node --test scripts/require-green-ci.test.mjs scripts/public-claims.test.mjs scripts/deploy-platform.test.mjs scripts/backup-service.test.mjs scripts/bounded-evidence.test.mjs
      - name: Brand motion regressions
        run: node --experimental-strip-types --test packages/ui/lib/brandMotion.test.mjs

  workflow-watchdog:
    name: Post-merge workflow watchdog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # `always()` makes this fail closed when a required sibling fails or is
    # cancelled instead of silently skipping the watchdog because of `needs`.
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    # The watchdog is itself part of the CI run, so polling that run's overall
    # conclusion from inside this job creates a self-deadlock: the run cannot
    # finish until the watchdog finishes. Observe every required sibling's
    # terminal result directly instead.
    needs:
      - lint-and-typecheck
      - test
      - build
      - docker
      - boot-smoke
      - db-migration-check
      - e2e
      - release-artifacts
      - release-contracts
    steps:
      - name: Verify required sibling jobs
        env:
          REQUIRED_JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$REQUIRED_JOB_RESULTS" | jq -r \
            'to_entries[] | "  \(.key): \(.value.result)"'
          if ! echo "$REQUIRED_JOB_RESULTS" | jq -e \
            'to_entries | length == 9 and all(.value.result == "success")' \
            >/dev/null; then
            echo "RESULT: at least one required CI sibling did not succeed." >&2
            exit 1
          fi
          echo "RESULT: all required CI siblings succeeded."
