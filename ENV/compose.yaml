services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aicos-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: aicos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: aicos_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aicos -d aicos_dev"]
      interval: 5s
      timeout: 5s
      retries: 5
    # security_opt lives in compose.prod.yaml only — Compose v2 merges
    # list fields additively, so duplicating `no-new-privileges:true`
    # here triggered "items at 0 and 1 are equal" validation failures
    # on `-f compose.yaml -f compose.prod.yaml`. Dev runs unhardened
    # (acceptable: local Docker isn't an attack surface).

  redis:
    image: redis:7-alpine
    container_name: aicos-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    # security_opt — see postgres comment above.

volumes:
  postgres_data:
  redis_data:
