# Braavolabs production nginx config (OPS-NEW-001 / digest 2026-04-25 ISS-020)
#
# Sits in front of the Docker stack from ENV/compose.prod.yaml. Terminates
# TLS, splits traffic by hostname (api → 8080, app → 3000, root → 3000),
# and forwards real client IPs so the Express rate limiter + audit log
# see actual addresses instead of "172.x.x.x" (Docker bridge).
#
# Place this file at /etc/nginx/sites-available/braavolabs.conf and link
# from /etc/nginx/sites-enabled/. Certificates from Let's Encrypt via
# certbot:  certbot --nginx -d braavolabs.com -d www.braavolabs.com -d \
#           api.braavolabs.com -d app.braavolabs.com
#
# If you prefer a single binary with auto-cert, see ENV/nginx/Caddyfile
# (the Caddy alternative).

# ── Rate-limit zones ─────────────────────────────────────────────────────
# Global edge limit on top of the Express rate limiter inside the API.
# 50 req/s burst is generous for the dashboard SPA + 5 req/s sustained.
limit_req_zone $binary_remote_addr zone=edge:10m rate=5r/s;

# ── HTTP → HTTPS redirect (all hosts) ───────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name braavolabs.com www.braavolabs.com api.braavolabs.com app.braavolabs.com;

    # Let's Encrypt webroot challenge — keep this above the redirect.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Apex + www (marketing site → UI on :3000) ───────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name braavolabs.com www.braavolabs.com;

    ssl_certificate /etc/letsencrypt/live/braavolabs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/braavolabs.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;

    # Security headers — helmet inside the API also sets these for /api/v1/*,
    # but static UI assets benefit from the edge-level headers too.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Cap the request body to match Express's 1mb json limit + a margin.
    # Stripe + generic webhooks are the only payloads that get bigger;
    # Stripe sends ~5KB events.
    client_max_body_size 2m;

    # Rate limit at the edge.
    limit_req zone=edge burst=50 nodelay;

    # Static Next.js assets — long-term cache.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Everything else → Next.js SSR/SSG.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }
}

# ── api.braavolabs.com → API on :8080 ───────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.braavolabs.com;

    ssl_certificate /etc/letsencrypt/live/braavolabs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/braavolabs.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;

    # CORS handled by the Express app; nginx just forwards.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Larger body for any future webhook batch payloads. Generic /hooks/:slug
    # uses HMAC-SHA256 against the parsed JSON, so this still matches the
    # express.json({ limit: "1mb" }) cap.
    client_max_body_size 2m;

    # Rate limit at the edge — the Express limiter inside the app does
    # per-tenant + per-endpoint limits on top of this.
    limit_req zone=edge burst=50 nodelay;

    # SSE run streaming (/api/v1/runs/:id/stream) — disable buffering.
    location /api/v1/runs/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;          # SSE keep-alive
    }

    # Stripe webhook — preserves raw body (the API route uses
    # express.raw() and is mounted before express.json so this just
    # passes through unchanged).
    location /hooks/stripe {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_request_buffering off;    # forward bytes as Stripe sent them
    }

    # Health endpoint — exclude from rate limit so uptime monitoring
    # never gets throttled.
    location = /health {
        proxy_pass http://127.0.0.1:8080;
        access_log off;
        limit_req off;
    }

    # Everything else → API.
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }
}

# ── app.braavolabs.com → UI on :3000 (authed dashboard) ─────────────────
# Same upstream as the apex but a separate hostname so cookies + CORS
# behave correctly when the dashboard is split off later.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.braavolabs.com;

    ssl_certificate /etc/letsencrypt/live/braavolabs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/braavolabs.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    client_max_body_size 2m;
    limit_req zone=edge burst=50 nodelay;

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }
}
