# Production compose — extends compose.yaml with prod-specific config.
# Usage: docker compose -f ENV/compose.yaml -f ENV/compose.prod.yaml up -d --build
# Alternative (standalone): docker compose -f ENV/compose.prod.yaml up -d --build

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aicos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aicos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: aicos_prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aicos -d aicos_prod"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    # Do NOT expose 5432 to host in prod — only internal network
    deploy:
      resources:
        limits:
          memory: 1G

  redis:
    image: redis:7-alpine
    container_name: aicos-redis
    restart: unless-stopped
    # BullMQ + Redis-backed lockout state both require `noeviction` —
    # if Redis evicts keys to free memory, queue jobs and lockout
    # counters silently disappear. allkeys-lru is wrong here.
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      --maxmemory 256mb
      --maxmemory-policy noeviction
      --save 60 1000
      --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    # Do NOT expose 6379 to host in prod — only internal network
    deploy:
      resources:
        limits:
          memory: 512M

  api:
    # Image is built and pushed by .github/workflows/deploy.yml on every
    # commit to main. The Lightsail host (1.9GB RAM) NEVER builds — that
    # pattern OOM-killed the kernel. Pull-only deploys use ~50MB RAM.
    #
    # IMAGE_TAG defaults to `latest` (CI-aliased). To pin a specific
    # commit, set IMAGE_TAG=sha-XXXXXXXX in .env (per-environment).
    image: ghcr.io/kocakkmustafa/braavolabs/api:${IMAGE_TAG:-latest}
    # build: kept commented out as a fallback — uncomment + remove the
    # `image:` line above if you ever need to build on the host (which
    # you really shouldn't on a 1.9GB instance):
    # build:
    #   context: ..
    #   dockerfile: ENV/Dockerfile.api
    container_name: aicos-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"  # Bind to localhost only — Nginx terminates TLS
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # connection_limit=20 sizes Prisma's pool well above the API's
      # concurrent request rate without overwhelming a single Postgres
      # instance (default would be 2*cpu_count + 1 ≈ 5-9 — fine until
      # workers run alongside, then exhausts under burst). pool_timeout
      # caps the queue wait for a connection so a leaking pool surfaces
      # quickly instead of pinning an HTTP request for minutes.
      # RLS-real STAGE 2: the app's RUNTIME connection. Set RUNTIME_DATABASE_URL
      # in the host .env to the non-superuser `aicos_app` role to ACTIVATE RLS
      # (that role can't bypass row-level security, so the STAGE 1 per-query
      # tenant binding starts being enforced). Unset → falls back to the owner
      # `aicos` role = today's behavior (RLS stays a no-op). One env line flips
      # it; remove the line to roll back. This repository only PREPARES that
      # switch: production activation remains MANUAL-BRAAVO-SECURITY-ROOTS.
      # See docs/security/tenant-rls-stage2-runbook.md.
      DATABASE_URL: ${RUNTIME_DATABASE_URL:-postgresql://aicos:${POSTGRES_PASSWORD}@postgres:5432/aicos_prod?schema=public&connection_limit=20&pool_timeout=15}
      TENANT_CONTEXT_FAIL_CLOSED: ${TENANT_CONTEXT_FAIL_CLOSED:-true}
      # Migrations MUST run as the schema OWNER (aicos) even after the runtime
      # switches to aicos_app — a non-superuser can't ALTER the schema. Always
      # the owner URL; consumed only by the deploy pipeline's migrate step.
      MIGRATE_DATABASE_URL: postgresql://aicos:${POSTGRES_PASSWORD}@postgres:5432/aicos_prod?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      # Auth / crypto (required)
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (min 32 chars, generate with openssl rand -hex 32)}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env (min 32 chars)}
      # App URL
      APP_URL: ${APP_URL:?Set APP_URL in .env (e.g. https://braavolabs.com)}
      # Exact additional CORS origins. Unset defaults to the official APP;
      # explicit empty disables extras; a custom comma-separated list overrides.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS-https://app.braavolabs.com}
      # LLM
      LLM_PROVIDER: ${LLM_PROVIDER:-api}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-sonnet-4-20250514}
      # Trial LLM (Groq) — first N pipeline runs for new tenants are routed
      # through this holding-owned key, no BYOK required. Empty = trial off.
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_TRIAL_MODEL: ${GROQ_TRIAL_MODEL:-llama-3.3-70b-versatile}
      # Pipeline export DRM — independent of JWT_SECRET so license tokens
      # can rotate without invalidating user sessions.
      LICENSE_JWT_SECRET: ${LICENSE_JWT_SECRET:-}
      LICENSE_TTL_DAYS: ${LICENSE_TTL_DAYS:-7}
      LICENSE_MACHINE_CHANGES_PER_MONTH: ${LICENSE_MACHINE_CHANGES_PER_MONTH:-1}
      # Billing (can be empty during soft-launch with BYPASS_BILLING=true)
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_CREATOR_PRICE_ID: ${STRIPE_CREATOR_PRICE_ID:-}
      STRIPE_CREATOR_YEARLY_PRICE_ID: ${STRIPE_CREATOR_YEARLY_PRICE_ID:-}
      STRIPE_PRO_PRICE_ID: ${STRIPE_PRO_PRICE_ID:-}
      STRIPE_PRO_YEARLY_PRICE_ID: ${STRIPE_PRO_YEARLY_PRICE_ID:-}
      STRIPE_BUSINESS_PRICE_ID: ${STRIPE_BUSINESS_PRICE_ID:-}
      STRIPE_BUSINESS_YEARLY_PRICE_ID: ${STRIPE_BUSINESS_YEARLY_PRICE_ID:-}
      STRIPE_ENTERPRISE_PRICE_ID: ${STRIPE_ENTERPRISE_PRICE_ID:-}
      BYPASS_BILLING: ${BYPASS_BILLING:-false}
      # OAuth
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI:-}
      # Mobile OAuth — iOS + Android use their own client IDs because
      # the redirect URI schemes differ from web (braavolabs:// vs https).
      GOOGLE_IOS_CLIENT_ID: ${GOOGLE_IOS_CLIENT_ID:-}
      GOOGLE_ANDROID_CLIENT_ID: ${GOOGLE_ANDROID_CLIENT_ID:-}
      GITHUB_MOBILE_CLIENT_ID: ${GITHUB_MOBILE_CLIENT_ID:-}
      GITHUB_MOBILE_CLIENT_SECRET: ${GITHUB_MOBILE_CLIENT_SECRET:-}
      # Apple Sign-In — both iOS native (SIWA bundle id) and the
      # web Service ID flow. The web Service ID is a separate
      # identifier from the iOS bundle id so the same Apple `sub`
      # works across both surfaces.
      APPLE_SIWA_BUNDLE_ID: ${APPLE_SIWA_BUNDLE_ID:-com.braavolabs.mobile}
      APPLE_WEB_SERVICE_ID: ${APPLE_WEB_SERVICE_ID:-}
      APPLE_WEB_REDIRECT_URI: ${APPLE_WEB_REDIRECT_URI:-}
      # Mobile in-app purchase (IAP) verification credentials. Apple
      # uses the App Store Server API (JWT signed with the AuthKey),
      # Google uses the Android Publisher API (service-account JSON
      # base64-encoded so the multi-line PEM survives env transport).
      APPLE_ISSUER_ID: ${APPLE_ISSUER_ID:-}
      APPLE_KEY_ID: ${APPLE_KEY_ID:-}
      APPLE_PRIVATE_KEY: ${APPLE_PRIVATE_KEY:-}
      APPLE_BUNDLE_ID: ${APPLE_BUNDLE_ID:-com.braavolabs.mobile}
      APPLE_SHARED_SECRET: ${APPLE_SHARED_SECRET:-}
      GOOGLE_PLAY_PACKAGE_NAME: ${GOOGLE_PLAY_PACKAGE_NAME:-com.braavolabs.mobile}
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:-}
      # Google Play RTDN Pub/Sub push auth (FINDINGS C1). Purchase verification
      # can be configured before RTDN. Without both bindings the API stays up,
      # but the RTDN endpoint rejects pushes. Before enabling Play RTDN, set
      # both to the exact Pub/Sub push OIDC audience and service-account email.
      GOOGLE_PUBSUB_AUDIENCE: ${GOOGLE_PUBSUB_AUDIENCE:-}
      GOOGLE_PUBSUB_SA_EMAIL: ${GOOGLE_PUBSUB_SA_EMAIL:-}
      # Keep durable webhook delivery off until the migration and provider
      # readback are accepted; the host .env can then enable it explicitly.
      IAP_DELIVERY_RELIABILITY_ENABLED: ${IAP_DELIVERY_RELIABILITY_ENABLED:-false}
      IAP_DELIVERY_MAX_ATTEMPTS: ${IAP_DELIVERY_MAX_ATTEMPTS:-5}
      REVENUECAT_WEBHOOK_SECRET: ${REVENUECAT_WEBHOOK_SECRET:-}
      # Email
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL:-noreply@braavolabs.com}
      # Sentry — wired in lib/sentry.ts. SDK is no-op when SENTRY_DSN unset.
      # In production, leaving this blank means uncaught exceptions die in
      # the log stream instead of paging on-call.
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-v1.0.0}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.05}
      # Trust proxy hops — 1 (nginx only) or 2 (Cloudflare + nginx).
      # Set in .env so the same image works in different deployment topologies.
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      # Integrations (HubSpot is per-company, stored encrypted in `integrations`)
      TIKTOK_CLIENT_KEY: ${TIKTOK_CLIENT_KEY:-}
      TIKTOK_CLIENT_SECRET: ${TIKTOK_CLIENT_SECRET:-}
      LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID:-}
      LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET:-}
      # Observability
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-ai-company-os-api}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1 not localhost — Alpine BusyBox wget resolves localhost
      # to ::1 (IPv6) first, hits Connection refused (API binds 0.0.0.0
      # IPv4 only), and never falls back to 127.0.0.1. Result: container
      # marked "unhealthy" forever even though /health returns 200.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 45s
    security_opt:
      - no-new-privileges:true
    # Read-only root filesystem — API doesn't write to disk (logs go to stdout, data to Postgres)
    read_only: true
    tmpfs:
      - /tmp:size=64m
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  ui:
    # Same CI-builds-and-pushes story as the api service above.
    # NEXT_PUBLIC_* are baked into the image at build time by GitHub
    # Actions (build-args in deploy.yml), so the host doesn't need to
    # know them at runtime — that's why this block is shorter than the
    # old `build:` form.
    image: ghcr.io/kocakkmustafa/braavolabs/ui:${IMAGE_TAG:-latest}
    # build: kept commented out — see the api service for context.
    # build:
    #   context: ..
    #   dockerfile: ENV/Dockerfile.ui
    #   args:
    #     NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set NEXT_PUBLIC_API_URL in .env}
    #     NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?Set NEXT_PUBLIC_APP_URL in .env}
    container_name: aicos-ui
    restart: unless-stopped
    ports:
      - "127.0.0.1:${UI_PORT:-3000}:3000"  # Bind to localhost only — Nginx terminates TLS
    environment:
      NODE_ENV: production
      PORT: 3000
      # Next.js standalone reads HOSTNAME and binds the listener to it
      # exclusively. The default in the runtime container was the docker
      # container hostname (e.g. cb4e7148b37c), which only its own eth0
      # IP could reach — the inbox-bound nginx upstream still worked
      # because docker DNS resolved aicos-ui to that IP, but the
      # container's own healthcheck via 127.0.0.1 / 0.0.0.0 kept failing
      # ("Connection refused"). Forcing HOSTNAME=0.0.0.0 makes Next.js
      # listen on all interfaces, healthcheck passes, and the runtime
      # reachability via aicos-ui:3000 stays the same.
      HOSTNAME: 0.0.0.0
      # Search-engine verification tokens. layout.tsx reads these at
      # request time (server component), so runtime env injection here
      # is enough — no rebuild required to swap a Google Search Console
      # token. Empty = tag omitted.
      GOOGLE_SITE_VERIFICATION: ${GOOGLE_SITE_VERIFICATION:-}
      BING_SITE_VERIFICATION: ${BING_SITE_VERIFICATION:-}
      YANDEX_VERIFICATION: ${YANDEX_VERIFICATION:-}
      # Sentry — server-side init reads SENTRY_DSN at runtime (no
      # rebuild needed to swap projects); client-side init reads
      # NEXT_PUBLIC_SENTRY_DSN which is baked into the bundle at
      # build-time via the Dockerfile ARG. Setting it here too keeps
      # runtime + build values consistent during local docker compose.
      SENTRY_DSN: ${UI_SENTRY_DSN:-${SENTRY_DSN:-}}
      NEXT_PUBLIC_SENTRY_DSN: ${UI_SENTRY_DSN:-${NEXT_PUBLIC_SENTRY_DSN:-}}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-v1.0.0}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.05}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1 — same Alpine BusyBox IPv6-first issue as the api block.
      # Keep the connection local, but use the trusted public authority:
      # production middleware intentionally rejects a loopback HTTP Host.
      test: ["CMD", "wget", "-q", "--spider", "--header=Host:www.braavolabs.com", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Optional: OTEL collector for observability (profile: observability)
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: aicos-otel
    restart: unless-stopped
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    profiles:
      - observability
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M

  # Automated daily Postgres backup + off-site S3 sync (DB-NEW-004 launch
  # blocker fix). Runs once every 24h, keeps 14 days locally, mirrors to
  # the configured S3 bucket on every successful dump.
  #
  # Off-site sync activates only when ALL of these are set:
  #   BACKUP_S3_BUCKET           — destination bucket name (no s3:// prefix)
  #   BACKUP_S3_PREFIX           — folder inside the bucket, e.g. "aicos-prod/"
  #   AWS_ACCESS_KEY_ID
  #   AWS_SECRET_ACCESS_KEY
  #   AWS_DEFAULT_REGION         — or BACKUP_S3_REGION
  # Without them the service falls back to local-only retention so dev /
  # staging deploys keep working.
  postgres-backup:
    # postgres:16-alpine ships pg_dump + gzip baked in (no runtime install
    # over the network on cold start, which was a supply-chain footgun
    # given the container holds DB credentials). aws-cli is added via
    # apk only when off-site backup is configured — otherwise the loop
    # writes to the backup volume locally with no network egress at all.
    image: postgres:16-alpine
    container_name: aicos-backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # PGPASSWORD is what pg_dump actually reads — POSTGRES_PASSWORD
      # is consumed by the postgres image at init time, not by the
      # client tool. Without PGPASSWORD pg_dump fails interactively
      # with "no password supplied" and the dump file ends up empty
      # (130-byte gzip header only). Both names point to the same
      # value to keep the .env single source of truth.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGHOST: postgres
      PGUSER: aicos
      PGDATABASE: aicos_prod
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-aicos-prod/}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${BACKUP_S3_REGION:-${AWS_DEFAULT_REGION:-us-east-1}}
    volumes:
      # Mutable backup data must not be written into sealed release input.
      - postgres_backup_data:/backups
    entrypoint: |
      sh -c '
        set -e
        set -o pipefail
        umask 077
        echo "[$$(date -Is)] backup service starting (image: postgres:16-alpine — pg_dump + gzip already present)"
        # Only install aws-cli if off-site sync is actually configured.
        if [ -n "$$BACKUP_S3_BUCKET" ] && [ -n "$$AWS_ACCESS_KEY_ID" ]; then
          if ! command -v aws >/dev/null 2>&1; then
            echo "[$$(date -Is)] installing aws-cli for off-site sync"
            apk add --no-cache aws-cli >/dev/null 2>&1 || echo "[$$(date -Is)] WARN: aws-cli install failed, off-site sync disabled"
          fi
        fi
        while true; do
          TIMESTAMP=$$(date +%Y%m%d-%H%M%S)
          FILE=/backups/aicos_prod_$$TIMESTAMP.sql.gz
          PART="$$FILE.part.$$$$"
          echo "[$$(date -Is)] taking backup $$FILE"
          if pg_dump --no-owner --no-acl | gzip > "$$PART" &&
             gzip -t "$$PART" &&
             mv "$$PART" "$$FILE"; then
            echo "[$$(date -Is)] dump done"
            # Off-site mirror — only when all credentials are set.
            if [ -n "$$BACKUP_S3_BUCKET" ] && [ -n "$$AWS_ACCESS_KEY_ID" ]; then
              S3_URI="s3://$$BACKUP_S3_BUCKET/$$BACKUP_S3_PREFIX$$(basename $$FILE)"
              echo "[$$(date -Is)] uploading to $$S3_URI"
              aws s3 cp "$$FILE" "$$S3_URI" --only-show-errors && \
                echo "[$$(date -Is)] off-site sync done" || \
                echo "[$$(date -Is)] WARN: off-site sync failed, local copy retained"
            else
              echo "[$$(date -Is)] WARN: BACKUP_S3_BUCKET / AWS_ACCESS_KEY_ID unset — local-only retention"
            fi
          else
            rm -f "$$PART"
            echo "[$$(date -Is)] ERROR: backup creation failed"
          fi
          # Retain last 14 days locally
          find /backups -name "aicos_prod_*.sql.gz" -mtime +14 -delete 2>/dev/null || true
          sleep 86400
        done
      '
    profiles:
      - backup
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  postgres_data:
  redis_data:
  postgres_backup_data:
