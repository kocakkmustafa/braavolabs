# Production compose — extends compose.yaml with prod-specific config.
# Usage: docker compose -f ENV/compose.yaml -f ENV/compose.prod.yaml up -d --build
# Alternative (standalone): docker compose -f ENV/compose.prod.yaml up -d --build

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aicos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aicos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: aicos_prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aicos -d aicos_prod"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    # Do NOT expose 5432 to host in prod — only internal network
    deploy:
      resources:
        limits:
          memory: 1G

  redis:
    image: redis:7-alpine
    container_name: aicos-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    # Do NOT expose 6379 to host in prod — only internal network
    deploy:
      resources:
        limits:
          memory: 512M

  api:
    build:
      context: ..
      dockerfile: ENV/Dockerfile.api
    container_name: aicos-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"  # Bind to localhost only — Nginx terminates TLS
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://aicos:${POSTGRES_PASSWORD}@postgres:5432/aicos_prod?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      # Auth / crypto (required)
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (min 32 chars, generate with openssl rand -hex 32)}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env (min 32 chars)}
      # App URL
      APP_URL: ${APP_URL:?Set APP_URL in .env (e.g. https://creatably.com)}
      # LLM
      LLM_PROVIDER: ${LLM_PROVIDER:-api}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-sonnet-4-20250514}
      # Billing (can be empty during soft-launch with BYPASS_BILLING=true)
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_CREATOR_PRICE_ID: ${STRIPE_CREATOR_PRICE_ID:-}
      STRIPE_CREATOR_YEARLY_PRICE_ID: ${STRIPE_CREATOR_YEARLY_PRICE_ID:-}
      STRIPE_PRO_PRICE_ID: ${STRIPE_PRO_PRICE_ID:-}
      STRIPE_PRO_YEARLY_PRICE_ID: ${STRIPE_PRO_YEARLY_PRICE_ID:-}
      STRIPE_BUSINESS_PRICE_ID: ${STRIPE_BUSINESS_PRICE_ID:-}
      STRIPE_BUSINESS_YEARLY_PRICE_ID: ${STRIPE_BUSINESS_YEARLY_PRICE_ID:-}
      STRIPE_ENTERPRISE_PRICE_ID: ${STRIPE_ENTERPRISE_PRICE_ID:-}
      BYPASS_BILLING: ${BYPASS_BILLING:-false}
      # OAuth
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      # Email
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL:-noreply@creatably.com}
      # Integrations
      HUBSPOT_ACCESS_TOKEN: ${HUBSPOT_ACCESS_TOKEN:-}
      HUBSPOT_PORTAL_ID: ${HUBSPOT_PORTAL_ID:-}
      TIKTOK_CLIENT_KEY: ${TIKTOK_CLIENT_KEY:-}
      TIKTOK_CLIENT_SECRET: ${TIKTOK_CLIENT_SECRET:-}
      LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID:-}
      LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET:-}
      # Observability
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-ai-company-os-api}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 45s
    security_opt:
      - no-new-privileges:true
    # Read-only root filesystem — API doesn't write to disk (logs go to stdout, data to Postgres)
    read_only: true
    tmpfs:
      - /tmp:size=64m
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  ui:
    build:
      context: ..
      dockerfile: ENV/Dockerfile.ui
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set NEXT_PUBLIC_API_URL in .env (e.g. https://creatably.com/api/v1)}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?Set NEXT_PUBLIC_APP_URL in .env (e.g. https://creatably.com)}
    container_name: aicos-ui
    restart: unless-stopped
    ports:
      - "127.0.0.1:${UI_PORT:-3000}:3000"  # Bind to localhost only — Nginx terminates TLS
    environment:
      NODE_ENV: production
      PORT: 3000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Optional: OTEL collector for observability (profile: observability)
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: aicos-otel
    restart: unless-stopped
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    profiles:
      - observability
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M

  # Automated daily Postgres backup — runs at 3 AM UTC
  postgres-backup:
    image: postgres:16-alpine
    container_name: aicos-backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGHOST: postgres
      PGUSER: aicos
      PGDATABASE: aicos_prod
    volumes:
      - ./backups:/backups
    entrypoint: |
      sh -c '
        echo "[$$(date -Is)] backup service started"
        while true; do
          TIMESTAMP=$$(date +%Y%m%d-%H%M%S)
          FILE=/backups/aicos_prod_$$TIMESTAMP.sql.gz
          echo "[$$(date -Is)] taking backup $$FILE"
          pg_dump --no-owner --no-acl | gzip > "$$FILE" && echo "[$$(date -Is)] done"
          # Retain last 14 days
          find /backups -name "aicos_prod_*.sql.gz" -mtime +14 -delete 2>/dev/null || true
          # Sleep until next 3am UTC
          sleep 86400
        done
      '
    profiles:
      - backup
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  postgres_data:
  redis_data:
